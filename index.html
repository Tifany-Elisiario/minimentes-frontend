<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniMentes</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>

            <h1>Mini<span>Mentes</span></h1>

        </div>

        <div class="animais-decoracao">

            <img src="imagens/gato.jpg" alt="Gato">
            <img src="imagens/leao.jpg" alt="Leão">
            <img src="imagens/elefante.jpg" alt="Elefante">

            <img src="imagens/macaco.jpg" alt="Macaco">
            <img src="imagens/girafa.jpg" alt="Girafa">

        <p style="color: var(--texto-claro); font-size: 1rem; margin-bottom: 10px;">

        </p>

        <button class="btn-comecar" onclick="window.location.href='atividades.html'">

        <button class="btn-responsavel" onclick="window.location.href='painel.html'">
