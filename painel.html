<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Responsável — MiniMentes</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <div class="painel-header">
        <h1>👨‍👩‍👧 Área do Responsável</h1>
        <p>Acompanhe o desempenho da criança</p>
    </div>

    <div style="padding: 10px 20px;">
        <button class="btn-secundario" onclick="window.location.href='index.html'" style="width: auto; padding: 10px 20px; font-size: 0.95rem;">
            ← Voltar ao Início
        </button>
    </div>

    <div id="area-resultados">
        <div class="sem-dados" id="sem-dados" style="display:none;">
            <div class="emoji">📊</div>
            <p>Nenhuma atividade realizada ainda.</p>
            <p style="font-size: 0.9rem; margin-top: 5px;">Os resultados aparecerão aqui depois que a criança jogar!</p>
        </div>
    </div>

    <script>
        const API = 'http://localhost:8080';

        async function carregarResultados() {
            try {
                const res = await fetch(`${API}/resultados`);
                const resultados = await res.json();

                const area = document.getElementById('area-resultados');

                if (resultados.length === 0) {
                    document.getElementById('sem-dados').style.display = 'block';
                    return;
                }

                // Agrupa por atividade
                const atividades = {};
                resultados.forEach(r => {
                    if (!atividades[r.atividade]) {
                        atividades[r.atividade] = [];
                    }
                    atividades[r.atividade].push(r);
                });

                // Ícones por atividade
                const icones = {
                    'Jogo da Memória': '🃏',
                    'Forme a Palavra': '🔤',
                    'Hora da Descoberta': '📖'
                };

                // Cria card para cada atividade
                Object.entries(atividades).forEach(([nome, dados]) => {
                    const ultimo = dados[dados.length - 1];
                    const melhorTempo = Math.min(...dados.map(d => d.tempoSegundos));
                    const totalSessoes = dados.length;

                    const card = document.createElement('div');
                    card.className = 'card-resultado';
                    card.innerHTML = `
                        <h3>${icones[nome] || '🎮'} ${nome}</h3>
                        <div class="stat">
                            <span class="stat-label">Última sessão — Acertos</span>
                            <span class="stat-valor">${ultimo.acertos}</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Último tempo</span>
                            <span class="stat-valor">${formatarTempo(ultimo.tempoSegundos)}</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Melhor tempo</span>
                            <span class="stat-valor">${formatarTempo(melhorTempo)}</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Vezes jogado</span>
                            <span class="stat-valor">${totalSessoes}x</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Última vez</span>
                            <span class="stat-valor">${formatarData(ultimo.dataHora)}</span>
                        </div>
                    `;
                    area.appendChild(card);
                });

            } catch (e) {
                console.error('Erro ao carregar resultados:', e);
                document.getElementById('sem-dados').style.display = 'block';
                document.getElementById('sem-dados').innerHTML = `
                    <div class="emoji">⚠️</div>
                    <p>Não foi possível conectar ao servidor.</p>
                    <p style="font-size: 0.9rem; margin-top: 5px;">Verifique se o backend está rodando.</p>
                `;
            }
        }

        function formatarTempo(segundos) {
            if (segundos < 60) return `${segundos}s`;
            const min = Math.floor(segundos / 60);
            const sec = segundos % 60;
            return `${min}min ${sec}s`;
        }

        function formatarData(dataHora) {
            if (!dataHora) return '-';
            const data = new Date(dataHora);
            return data.toLocaleDateString('pt-BR', {
                day: '2-digit',
                month: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        carregarResultados();
    </script>
</body>
</html>
